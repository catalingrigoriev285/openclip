name: Release

# Builds openclip and publishes a GitHub Release.
#
# Windows is the primary (and currently the only enabled) target. The Linux
# and macOS matrix entries and their dependency-install steps are commented
# out below; uncomment them to bring those platforms back.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag must match the version in Cargo.toml. A manual run (workflow_dispatch)
# only builds and uploads the archives as workflow artifacts — no release is made.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            bin: openclip.exe
            # The game-capture hook, loaded into games. It shares a compiled-in
            # ABI version with the exe, so the two must ship together.
            hook: openclip_hook64.dll
            archive: zip
          # - name: linux-x86_64
          #   os: ubuntu-latest
          #   bin: openclip
          #   archive: tar.gz
          # - name: macos-arm64
          #   os: macos-latest
          #   bin: openclip
          #   archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      # Every crate, not just the root one. The hook DLL reports its *own*
      # crate version to the UI's "Hook" row, so a crate left behind makes a
      # correctly updated component look stale.
      - name: Check that the tag matches every Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          fail=0
          for manifest in Cargo.toml crates/openclip-overlay/Cargo.toml crates/openclip-hook/Cargo.toml; do
            crate="$(grep -m1 '^version' "$manifest" | sed -E 's/.*"([^"]+)".*/\1/')"
            if [ "$crate" != "$tag" ]; then
              echo "::error file=$manifest::$manifest version ($crate) does not match tag ($tag)"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Bumping the version in Cargo.toml (e.g. via the GitHub editor) also
      # changes the crate's own entry in Cargo.lock; `--locked` refuses to
      # build until that is committed.
      - name: Check that Cargo.lock is up to date
        shell: bash
        run: |
          if ! cargo metadata --locked --format-version 1 > /dev/null; then
            echo "::error::Cargo.lock is out of date. Run 'cargo update --workspace' locally and commit Cargo.lock."
            exit 1
          fi

      # OpenH264 assembly kernels (~2x encoder throughput). Without nasm the
      # build silently falls back to C.
      - uses: ilammy/setup-nasm@v1

      # - name: Install Linux build dependencies
      #   if: runner.os == 'Linux'
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y build-essential autoconf automake libtool \
      #       libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
      #       libssl-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev \
      #       libasound2-dev libx11-dev \
      #       libegl1-mesa-dev libgl1-mesa-dev libwayland-dev libxkbcommon-x11-dev

      # - name: Install macOS build dependencies
      #   if: runner.os == 'macOS'
      #   run: brew install autoconf automake libtool

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked --workspace

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')-${GITHUB_SHA::7}"
          fi
          name="openclip-${version}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          cp "target/release/${{ matrix.bin }}" LICENSE README.md "dist/$name/"
          cp assets/fonts/FONT-AWESOME-LICENSE.txt "dist/$name/"
          hook="${{ matrix.hook }}"
          if [ -n "$hook" ]; then
            # Fail loudly: a silently missing DLL would ship a Game mode that
            # only fails at the moment someone tries to use it.
            if [ ! -f "target/release/$hook" ]; then
              echo "::error::$hook was not built"
              exit 1
            fi
            cp "target/release/$hook" "dist/$name/"
          fi
          cd dist
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: openclip-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    # Publish whatever platforms built even if one failed; a missing platform is
    # visible in the job summary rather than blocking the whole release.
    if: startsWith(github.ref, 'refs/tags/') && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
