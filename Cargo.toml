[package]
name = "openclip"
version = "0.1.6"
edition = "2024"
license = "Apache-2.0"
description = "Cross-platform screen recorder with an egui GUI and no external runtime dependencies"
repository = "https://github.com/catalingrigoriev285/openclip"

# The root package is also the workspace root, so `[profile.*]` below keeps
# applying to everything and `target/` stays where it is.
[workspace]
members = ["crates/openclip-overlay", "crates/openclip-hook"]
default-members = [".", "crates/openclip-hook"]
resolver = "3"

[dependencies]
# Overlay rasteriser shared with the code injected into games, which cannot
# link egui. `serde` is only wanted on this side, for settings.json.
openclip-overlay = { path = "crates/openclip-overlay", features = ["serde"] }
eframe = "0.36"
egui = "0.36"
openh264 = "0.9"
yuv = "0.8"
cpal = "0.18"
mp3lame-encoder = "0.2"
xcap = "0.9"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
rfd = "0.15"
device_query = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
fast_image_resize = "5"
# Thumbnails for the library: decodes the picture formats the Images tab lists.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }

# Update checker / self-updater (GitHub Releases). All statically linked.
ureq = { version = "3", features = ["json", "platform-verifier"] }
semver = "1"
sha2 = "0.10"
self-replace = "1"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Time",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Media",
    "Win32_System_Threading",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    # Game capture. `Win32_Graphics_Dxgi` is NOT implied by `Dxgi_Common` and is
    # not enabled by windows-capture either, so it has to be asked for by name;
    # the rest were only ever reaching us through windows-capture's own feature
    # list, which is not something to depend on across a `cargo update`.
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct3D",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
mp4-atom = "0.15"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
