[package]
name = "openclip"
version = "0.1.1"
edition = "2026"
license = "Apache-2.0"
description = "Cross-platform screen recorder with an egui GUI and no external runtime dependencies"
repository = "https://github.com/catalingrigoriev285/openclip"

[dependencies]
eframe = "0.36"
egui = "0.36"
openh264 = "0.9"
yuv = "0.8"
cpal = "0.18"
mp3lame-encoder = "0.2"
xcap = "0.9"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
rfd = "0.15"
device_query = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
fast_image_resize = "5"

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Media",
    "Win32_System_Threading",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
mp4-atom = "0.15"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
